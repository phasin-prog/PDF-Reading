<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- Document outline -->
  <rect x="110" y="90" width="220" height="300" rx="24" fill="#ffffff" opacity="0.95" />
  <path d="M260 90 L330 160 L260 160 Z" fill="#cbd5e1" />
  <!-- Lines on doc -->
  <rect x="145" y="180" width="110" height="12" rx="6" fill="#94a3b8" />
  <rect x="145" y="210" width="150" height="12" rx="6" fill="#94a3b8" />
  <rect x="145" y="240" width="130" height="12" rx="6" fill="#94a3b8" />
  <rect x="145" y="270" width="90" height="12" rx="6" fill="#94a3b8" />
  <!-- Audio sound waves / headphones floating on right -->
  <circle cx="340" cy="310" r="85" fill="#0f172a" />
  <!-- Sound wave bars inside dark circle -->
  <rect x="290" y="295" width="8" height="30" rx="4" fill="url(#waveGrad)" />
  <rect x="306" y="280" width="8" height="60" rx="4" fill="url(#waveGrad)" />
  <rect x="322" y="265" width="8" height="90" rx="4" fill="url(#waveGrad)" />
  <rect x="338" y="250" width="8" height="120" rx="4" fill="url(#waveGrad)" />
  <rect x="354" y="270" width="8" height="80" rx="4" fill="url(#waveGrad)" />
  <rect x="370" y="285" width="8" height="50" rx="4" fill="url(#waveGrad)" />
  <rect x="386" y="300" width="8" height="20" rx="4" fill="url(#waveGrad)" />
</svg>
